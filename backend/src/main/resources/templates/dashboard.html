<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Tableau de bord - JakartaDeRoll</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5 flex-grow-1">

    <h1>Tableau de bord</h1>

    <p class="text-muted">
        Retrouvez les principales fonctionnalités de JakartaDeRoll.
    </p>

    <div class="row g-4 mt-3">

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">

                    <h4>Campagnes</h4>

                    <p class="text-muted">
                        Consultez et créez vos campagnes.
                    </p>

                    <a th:href="@{/campaigns}"
                       class="btn btn-primary">
                        Voir les campagnes
                    </a>

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">

                    <h4>Joueurs</h4>

                    <p class="text-muted">
                        Consultez et ajoutez des joueurs.
                    </p>

                    <a th:href="@{/players}"
                       class="btn btn-primary">
                        Voir les joueurs
                    </a>

                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">

                    <h4>Personnages</h4>

                    <p class="text-muted">
                        Gérez les personnages de vos campagnes.
                    </p>

                    <span class="badge bg-secondary">
                        À venir
                    </span>

                </div>
            </div>
        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
