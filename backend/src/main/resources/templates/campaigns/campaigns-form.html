<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Créer une campagne - JakartaDeRoll</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5 flex-grow-1">

    <div class="card shadow-sm mx-auto p-4" style="max-width: 600px;">

        <h2 class="mb-4">Créer une campagne</h2>

        <form th:action="@{/campaigns/create}" method="post">

            <div class="mb-3">

                <label for="name" class="form-label">
                    Nom de la campagne
                </label>

                <input type="text"
                       id="name"
                       name="name"
                       class="form-control"
                       placeholder="Exemple : Les Chroniques oubliées"
                       required
                       maxlength="100">

            </div>

            <div class="mb-3">

                <label for="description" class="form-label">
                    Description
                </label>

                <textarea id="description"
                          name="description"
                          class="form-control"
                          rows="5"
                          placeholder="Présentez votre campagne..."></textarea>

            </div>

            <div class="mb-3">

                <label for="gamemasterId" class="form-label">
                    Maître du jeu
                </label>

                <select id="gamemasterId"
                        name="gamemasterId"
                        class="form-select"
                        required>

                    <option value="" disabled selected>
                        Choisir un maître du jeu
                    </option>

                    <option th:each="player : ${players}"
                            th:value="${player.id}"
                            th:text="${player.name}">
                        Nom du joueur
                    </option>

                </select>

                <div class="form-text">
                    Le maître du jeu sera automatiquement associé à la campagne.
                </div>

            </div>

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary flex-grow-1">
                    Créer la campagne
                </button>

                <a th:href="@{/campaigns}"
                   class="btn btn-outline-secondary">
                    Annuler
                </a>

            </div>

        </form>

        <div class="alert alert-warning mt-3 mb-0"
             th:if="${players == null or players.isEmpty()}">

            Vous devez d'abord créer au moins un joueur
            pour pouvoir créer une campagne.

            <a th:href="@{/players/create}">
                Créer un joueur
            </a>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
