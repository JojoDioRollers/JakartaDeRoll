<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Erreur - JakartaDeRoll</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container flex-grow-1 d-flex justify-content-center align-items-center">

    <div class="text-center">

        <h1 class="display-1 fw-bold text-danger"
            th:text="${status != null ? status : 'Erreur'}">
            Erreur
        </h1>

        <h2>Une erreur est survenue</h2>

        <p class="text-muted mt-3"
           th:text="${message != null ? message : 'Une erreur inattendue est survenue.'}">
            Une erreur inattendue est survenue.
        </p>

        <a th:href="@{/}" class="btn btn-primary mt-3">
            Retour à l'accueil
        </a>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
