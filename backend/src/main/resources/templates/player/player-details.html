<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Détails du joueur - JakartaDeRoll</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5 flex-grow-1">

    <a th:href="@{/players}"
       class="btn btn-outline-secondary mb-4">
        Retour aux joueurs
    </a>

    <div class="card shadow-sm mb-4">

        <div class="card-body">

            <h1 th:text="${player.name}">
                Nom du joueur
            </h1>

            <p class="text-muted">
                Informations du joueur.
            </p>

        </div>

    </div>

    <h3 class="mb-3">Ses campagnes</h3>

    <div class="row g-4"
         th:if="${campaigns != null and !campaigns.isEmpty()}">

        <div class="col-md-6"
             th:each="campaign : ${campaigns}">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 th:text="${campaign.name}">
                        Nom de la campagne
                    </h5>

                    <p th:text="${campaign.description}"
                       class="text-muted">
                        Description
                    </p>

                    <a th:href="@{/campaigns/{id}(id=${campaign.id})}"
                       class="btn btn-outline-primary btn-sm">
                        Voir la campagne
                    </a>

                </div>

            </div>

        </div>

    </div>

    <div class="alert alert-info"
         th:if="${campaigns == null or campaigns.isEmpty()}">

        Ce joueur ne participe actuellement à aucune campagne.

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
