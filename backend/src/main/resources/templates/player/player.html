<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Joueurs - JakartaDeRoll</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container my-5 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h1>Joueurs</h1>

            <p class="text-muted">
                Gérez les joueurs de votre application.
            </p>
        </div>

        <a th:href="@{/players/create}" class="btn btn-primary">
            Ajouter un joueur
        </a>

    </div>

    <!-- Liste des joueurs -->
    <div class="row g-4"
         th:if="${players != null and !players.isEmpty()}">

        <div class="col-md-4" th:each="player : ${players}">

            <div class="card shadow-sm h-100">

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${player.name}">
                        Nom du joueur
                    </h5>

                    <a th:href="@{/players/{id}(id=${player.id})}"
                       class="btn btn-outline-primary btn-sm mt-2">
                        Consulter
                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- Aucun joueur -->
    <div class="alert alert-info"
         th:if="${players == null or players.isEmpty()}">

        Aucun joueur n'a encore été créé.

        <a th:href="@{/players/create}">
            Ajouter le premier joueur.
        </a>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
